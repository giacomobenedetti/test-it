# =============================================================================
# WORKSHOP DEMO — intentionally vulnerable firmware build pipeline
# DO NOT USE IN PRODUCTION
# =============================================================================

name: Firmware build (VULNERABLE — workshop demo)

on:
  push:
    branches: [main]
  pull_request_target:                  
    types: [opened, synchronize]        

permissions: write-all                  

jobs:
  sast-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v4    

      - name: Install PlatformIO
        run: pip install platformio


      - name: Cache PlatformIO packages
        uses: actions/cache@v3          
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}     
      - name: Log build info
        run: |
          echo "Building PR: ${{ github.event.pull_request.title }}"
          echo "Branch: ${{ github.event.pull_request.head.ref }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"

      - name: Run SAST (clang-tidy via PlatformIO)
        run: pio check --environment m5stick-c --severity low

      
      - name: Build firmware
        run: |
          D_WIFI_SSID="${{ secrets.WIFI_SSID }}" \
          D_WIFI_PASS="${{ secrets.WIFI_PASS }}" \
          D_WIFI_USER="${{ secrets.WIFI_USER }}" \
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          pio run --environment m5stick-c

      
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4   
        with:
          name: firmware-m5stick
          path: |
            .pio/build/m5stick-c/firmware.bin
            .pio/build/m5stick-c/partitions.bin
